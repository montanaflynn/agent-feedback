name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: >-
          npm publish --provenance --access public
          -w @agent-feedback/core
          -w @agent-feedback/react
          -w @agent-feedback/vite
          -w @agent-feedback/next
          -w @agent-feedback/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
